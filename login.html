<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BIZCONNECTA</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 75% 0%, rgba(118, 37, 232, 0.14), transparent 30%), #05051f;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: #120d42;
            border: 1px solid rgba(150, 70, 255, .18);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .3);
        }

        .login-logo {
            text-align: center;
            font-size: 32px;
            font-weight: 900;
            color: #a84cff;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(150, 60, 255, .4);
        }

        .header-subtitle {
            text-align: center;
            color: #aaa5c0;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .login-section h1 {
            font-size: 26px;
            margin-bottom: 10px;
            text-align: center;
        }

        .login-section > p {
            color: #aaa5c0;
            font-size: 14px;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #c6c0d8;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px;
            background-color: #0a0631;
            border: 1px solid #3a3a5a;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            border-color: #a43cff;
            box-shadow: 0 0 0 3px rgba(164, 60, 255, .15);
        }

        .form-group input::placeholder {
            color: #57526b;
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
            color: #aaa5c0;
        }

        .login-options label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .login-options input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #7625e8;
        }

        .login-options a {
            color: #a84cff;
            text-decoration: none;
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #7625e8, #963cff);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(118, 37, 232, .4);
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #aaa5c0;
        }

        .register-link a {
            color: #a84cff;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main class="login-page">
        <section class="login-container">

            <header class="login-header">
                <div class="login-logo">BIZCONNECTA</div>
                <div class="header-subtitle">Collaboration • Grow • Connect</div>
            </header>

            <section class="login-section">
                <h1>Welcome Back</h1>
                <p>Login to your BIZCONNECTA account.</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Username or Email</label>
                        <input type="text" id="username" name="username" placeholder="Enter your username or email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>

                    <div class="login-options">
                        <label>
                            <input type="checkbox" name="remember">
                            Remember me
                        </label>
                        <a href="forgot-password.html">Forgot Password?</a>
                    </div>

                    <button type="submit" class="login-btn">Login</button>
                </form>

                <div class="register-link">
                    <p>Don't have an account? <a href="register.html">Create Account</a></p>
                </div>

            </section>
        </section>
    </main>

    <!-- JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase Config (Live)
        const SUPABASE_URL = 'https://ebpoivaipywkbedvkhtg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LrJNzNSpKeYJn9ro9o7IQQ_M3knRSL9';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Handle Login
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const email_or_username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabaseClient
                .from('users')
                .select('*')
                .eq('email', email_or_username)
                .eq('password', password)
                .single();

            if (error || !data) {
                alert('Invalid username or password. Please try again.');
            } else {
                alert('Login successful! Welcome back, ' + data.full_name + '!');
                
                // Save user email locally for other pages to use
                localStorage.setItem('user_email', data.email);
                
                // Redirect to dashboard
                window.location.href = 'dashboard.html';
            }
        });
    </script>

</body>
</html>
