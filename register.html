<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - BIZCONNECTA</title>

    <style>
        /* =========================================
           SINGLE-FILE CSS FOR REGISTER PAGE
        ========================================== */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 75% 0%, rgba(118, 37, 232, 0.14), transparent 30%), #05051f;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-container {
            width: 100%;
            max-width: 500px;
            background: #120d42;
            border: 1px solid rgba(150, 70, 255, .18);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .3);
            margin: 40px auto; /* Added margin so it can scroll if too tall */
        }

        .register-logo {
            text-align: center;
            font-size: 32px;
            font-weight: 900;
            color: #a84cff;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(150, 60, 255, .4);
        }

        .header-subtitle {
            text-align: center;
            color: #aaa5c0;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .register-section h1 {
            font-size: 26px;
            margin-bottom: 10px;
            text-align: center;
        }

        .register-section > p {
            color: #aaa5c0;
            font-size: 14px;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #c6c0d8;
            font-weight: 500;
        }

        /* Dark input fields */
        .form-group input {
            width: 100%;
            padding: 14px 15px;
            background-color: #0a0631;
            border: 1px solid #3a3a5a;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            border-color: #a43cff;
            box-shadow: 0 0 0 3px rgba(164, 60, 255, .15);
        }

        .form-group input::placeholder {
            color: #57526b;
        }

        /* Checkbox */
        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #aaa5c0;
        }

        .terms input[type="checkbox"] {
            margin-top: 3px;
            width: 16px;
            height: 16px;
            accent-color: #7625e8;
        }

        .terms a {
            color: #a84cff;
            text-decoration: underline;
        }

        /* Button */
        .register-btn {
            width: 100%;
            background: linear-gradient(135deg, #7625e8, #963cff);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(118, 37, 232, .4);
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #aaa5c0;
        }

        .login-link a {
            color: #a84cff;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <main class="register-page">
        <section class="register-container">

            <header class="register-header">
                <div class="register-logo">BIZCONNECTA</div>
                <div class="header-subtitle">Collaboration • Grow • Connect</div>
            </header>

            <section class="register-section">
                <h1>Create Your Account</h1>
                <p>Join BIZCONNECTA and start growing with us.</p>

                <!-- FIXED: Added onsubmit="return false;" -->
                <form id="registerForm" onsubmit="return false;">
                    <!-- FIRST NAME -->
                    <div class="form-group">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first_name" placeholder="Enter your first name" required>
                    </div>

                    <!-- LAST NAME -->
                    <div class="form-group">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last_name" placeholder="Enter your last name" required>
                    </div>

                    <!-- USERNAME -->
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Choose a username" required>
                    </div>

                    <!-- EMAIL -->
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                    </div>

                    <!-- PHONE -->
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                    </div>

                    <!-- PASSWORD -->
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Create a password" required>
                    </div>

                    <!-- CONFIRM PASSWORD -->
                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm your password" required>
                    </div>

                    <!-- REFERRAL CODE -->
                    <div class="form-group">
                        <label for="referral-code">Referral Code (Optional)</label>
                        <input type="text" id="referral-code" name="referral_code" placeholder="Enter referral code">
                    </div>

                    <!-- TERMS -->
                    <div class="terms">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">
                            I agree to the <a href="terms-and-condition.html">Terms & Conditions</a> and <a href="#">Privacy Policy</a>
                        </label>
                    </div>

                    <!-- REGISTER BUTTON -->
                    <button type="submit" class="register-btn">Create Account</button>
                </form>

                <!-- LOGIN LINK -->
                <div class="login-link">
                    <p>Already have an account? <a href="login.html">Login</a></p>
                </div>

            </section>
        </section>
    </main>

    <!-- SINGLE-FILE JAVASCRIPT -->
    <script>
        // 1. Supabase Configuration (Pasted directly here so no external file is needed)
        const SUPABASE_URL = 'https://ebpoivaipywkbedvkhtg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LrJNzNSpKeYJn9ro9o7IQQ_M3knRSL9';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. Handle Registration Form
        document.getElementById('registerForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const first_name = document.getElementById('first-name').value;
            const last_name = document.getElementById('last-name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm-password').value;
            const terms = document.getElementById('terms').checked;

            // CRITICAL: Check passwords match
            if (password !== confirm_password) {
                alert('Passwords do not match! Please check and try again.');
                return;
            }

            // Check terms
            if (!terms) {
                alert('Please agree to the Terms & Conditions.');
                return;
            }

            const full_name = first_name + ' ' + last_name;

            // Insert into Supabase
            const { data, error } = await supabaseClient
                .from('users')
                .insert([
                    { full_name: full_name, email: email, password: password }
                ]);

            if (error) {
                alert('Error creating account: ' + error.message);
            } else {
                alert('Account created successfully!');
                window.location.href = 'dashboard.html'; // Redirect to dashboard
            }
        });
    </script>

    <!-- Load Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</body>
</html>
